name: Zyrex public bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zyrex-bootstrap.yml'
      - 'scripts/bootstrap-checkpoint.py'
      - 'scripts/bootstrap-smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Check English public content
        run: python3 scripts/check-public-content.py
      - name: Build the native node
        run: scripts/sbt assembly
      - name: Fetch a public testnet checkpoint
        run: python3 scripts/bootstrap-checkpoint.py --output .local/bootstrap-checkpoint.json
      - name: Synchronize fresh nodes through each public bootstrap separately
        run: >-
          python3 scripts/bootstrap-smoke.py
          --expected-info .local/bootstrap-checkpoint.json
          --output artifacts/bootstrap-verification.json
      - name: Preserve public verification results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-bootstrap-verification
          path: artifacts/bootstrap-verification.json
          if-no-files-found: error
          retention-days: 30
