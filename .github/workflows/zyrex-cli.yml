name: Zyrex Linux CLI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check English public content
        run: python3 scripts/check-public-content.py
      - name: Test exact amounts, node pinning and credential isolation
        working-directory: cli
        run: go test ./...
      - name: Build static x86_64 and ARM64 binaries
        run: scripts/build-cli
      - name: Check dependency-free execution on Ubuntu 24.04 and an empty Linux image
        run: |
          docker run --rm --read-only --memory=64m \
            -v "$PWD/artifacts/cli/zyrex-cli-linux-amd64/zyrex-cli:/usr/local/bin/zyrex-cli:ro" \
            ubuntu:24.04 zyrex-cli version
          printf 'FROM scratch\nCOPY zyrex-cli /zyrex-cli\nENTRYPOINT ["/zyrex-cli"]\n' > /tmp/Dockerfile.zyrex-cli
          docker build -f /tmp/Dockerfile.zyrex-cli -t zyrex-cli-check artifacts/cli/zyrex-cli-linux-amd64
          docker run --rm --read-only --memory=64m zyrex-cli-check version
      - name: Check release tag matches the binary version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          cli_version="$(artifacts/cli/zyrex-cli-linux-amd64/zyrex-cli version | jq -r '.version')"
          test "$GITHUB_REF_NAME" = "cli-v$cli_version"
      - name: Preserve tested release archives
        if: startsWith(github.ref, 'refs/tags/cli-v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cli-release
          path: |
            artifacts/cli/zyrex-cli-linux-amd64.tar.gz
            artifacts/cli/zyrex-cli-linux-arm64.tar.gz
            artifacts/cli/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v') && github.event_name != 'pull_request'
    needs: portable-client
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-cli-release
          path: artifacts/cli
      - name: Publish verified testnet release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd artifacts/cli && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            artifacts/cli/zyrex-cli-linux-amd64.tar.gz \
            artifacts/cli/zyrex-cli-linux-arm64.tar.gz \
            artifacts/cli/SHA256SUMS \
            --verify-tag --draft --prerelease \
            --title "Zyrex CLI ${GITHUB_REF_NAME#cli-}" --notes-file cli/RELEASE.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
