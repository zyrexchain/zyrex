name: Zyrex private testnet
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  consensus:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Check English public content
        run: python3 scripts/check-public-content.py
      - name: Pool resource budgets, reorganization safety and durable payouts
        run: python3 -m unittest discover -s pool -p 'test_*.py' -v
      - name: Explorer canonical index and rollback tests
        run: PYTHONPATH=pool python3 -m unittest discover -s explorer -p 'test_*.py' -v
      - name: Consensus, address, network and upstream PoW/DAA tests
        run: >-
          scripts/sbt 'testOnly *ZyrexConsensusSpec *ZyrexTestKeysSpec *ErgoSettingsSpecification *MessageSerializerSpecification *NetworkControllerSpec'
          'zyrexCore/testOnly *DifficultyAdjustmentSpecification *AutolykosPowSchemeSpec
          *ZyrexExplorerAddressSpec *ZyrexDaaStressSpec *ZyrexPoolHeaderSpec' assembly
      - name: Native DAA stress evidence for each source configuration
        run: >-
          scripts/sbt
          'zyrexCore/Test/runMain org.ergoplatform.mining.difficulty.ZyrexDaaSimulation .local/audit-daa/results.json'
      - name: Preserve native DAA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-daa-verification
          path: .local/audit-daa/results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Launch three private nodes
        run: scripts/devnet-up
      - name: Test payments, payouts and restart recovery
        run: python3 scripts/private-smoke.py --restart
      - name: Launch private Stratum pool on loopback
        env:
          ZYREX_POOL_BIND_IP: 127.0.0.1
        run: scripts/pool-up
      - name: Real Stratum proof search and confirmed payments to two miners
        run: python3 scripts/pool-smoke.py --host 127.0.0.1 --restart
      - name: Stop private nodes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.pool.yml down
