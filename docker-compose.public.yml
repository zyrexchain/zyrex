name: zyrex-testnet
services:
  node:
    build: .
    image: zyrex:public-testnet
    restart: unless-stopped
    command: [--testnet, -c, /etc/zyrex/node.conf]
    environment:
      DATADIR: /var/lib/zyrex
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1200m -XX:ActiveProcessorCount=2
    mem_limit: 2g
    cpus: 1.5
    ports:
      - "127.0.0.1:19531:19531"
      - "127.0.0.1:19554:19554"
    volumes:
      - node:/var/lib/zyrex
      - ./.local/public-testnet/node.conf:/etc/zyrex/node.conf:ro
    networks: [public]
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "5", http://127.0.0.1:19554/info]
      interval: 5s
      timeout: 6s
      retries: 30
    stop_grace_period: 30s
  pool:
    build: ./pool
    image: zyrex-pool:public-testnet
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      node:
        condition: service_healthy
    ports:
      - "127.0.0.1:13333:3333"
      - "127.0.0.1:18088:8088"
    volumes:
      - pool:/var/lib/zyrex-pool
      - ./.local/public-testnet/pool:/etc/zyrex-pool:ro
    networks: [public]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
    stop_grace_period: 15s
  explorer:
    build:
      context: .
      dockerfile: explorer/Dockerfile
    image: zyrex-explorer:public-testnet
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      node:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - explorer:/var/lib/zyrex-explorer
      - ./.local/public-testnet/explorer.json:/etc/zyrex-explorer/config.json:ro
    networks: [public]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
    stop_grace_period: 15s
networks:
  public:
    ipam:
      config:
        - subnet: 172.30.95.0/24
volumes:
  node: {}
  pool: {}
  explorer: {}
