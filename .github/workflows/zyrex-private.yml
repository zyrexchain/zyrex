name: Zyrex private testnet
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Check English public content
        run: python3 scripts/check-public-content.py
      - name: LAN pool PoW, Stratum and durable payout tests
        run: python3 -m unittest discover -s pool -p 'test_*.py' -v
      - name: Consensus, address, network and upstream PoW/DAA tests
        run: scripts/sbt 'testOnly *ZyrexConsensusSpec *ZyrexTestKeysSpec *MessageSerializerSpecification' 'ergoCore/testOnly *DifficultyAdjustmentSpecification *AutolykosPowSchemeSpec' assembly
      - name: Launch three private nodes
        run: scripts/devnet-up
      - name: Test payments, payouts and restart recovery
        run: python3 scripts/private-smoke.py --restart
      - name: Launch private Stratum pool on loopback
        env:
          ZYREX_POOL_BIND_IP: 127.0.0.1
        run: scripts/pool-up
      - name: Real Stratum proof search and confirmed payments to two miners
        run: python3 scripts/pool-smoke.py --host 127.0.0.1 --restart
      - name: Stop private nodes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.pool.yml down
